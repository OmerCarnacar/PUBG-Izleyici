[project]
name = "pubg-izleyici"
description = "PUBG Canlı İzleyici: FPS, sensörler, ayar kontrolü, maç tekrarı ve koç raporu (Windows)"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "psutil==7.2.2",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.3",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = ["build", "dist", "pm"]

[tool.ruff.lint]
# Önce gerçek hatalar: tanımsız ad, kullanılmayan import, sözdizimi. Biçim kuralları sonraki aşamada.
select = ["F", "E9"]
