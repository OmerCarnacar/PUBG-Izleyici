# main dalına pubg_izleyici/config.py içinde yeni bir VERSION gönderilince EXE'yi derler ve GitHub Releases'e koyar.
# Aynı sürüm zaten yayımlanmışsa hiçbir şey yapmaz. Programın güncelleyicisi en son sürümü buradan indirir.
name: Sürüm yayımla

on:
  push:
    branches: [main]
    paths: ['pubg_izleyici/**', 'run.py', 'pyproject.toml', 'RELEASE_NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PRESENTMON: v2.6.0
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını oku
        id: v
        shell: pwsh
        run: |
          $m = Select-String -Path pubg_izleyici/config.py -Pattern "^VERSION = '([0-9.]+)'"
          if (-not $m) { throw 'VERSION bulunamadı' }
          $ver = $m.Matches[0].Groups[1].Value
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if ($LASTEXITCODE -eq 0) { "skip=1" >> $env:GITHUB_OUTPUT; Write-Host "v$ver zaten yayımlanmış, atlanıyor." }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip != '1'
        with:
          python-version: '3.12'

      - name: Kod denetimi (ruff)
        if: steps.v.outputs.skip != '1'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.1
          python -m ruff check pubg_izleyici run.py

      - name: EXE derle
        if: steps.v.outputs.skip != '1'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3 psutil==7.2.2 pillow==13.0.0
          gh release download $env:PRESENTMON -R GameTechDev/PresentMon --pattern 'PresentMon-*-x64.exe' -D pm
          $pm = (Get-ChildItem pm\PresentMon-*-x64.exe)[0].FullName
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name PUBG_Izleyici --add-binary "$pm;." run.py
          if (-not (Test-Path dist\PUBG_Izleyici.exe)) { throw 'Derleme başarısız' }

      - name: Sürümü yayımla
        if: steps.v.outputs.skip != '1'
        shell: pwsh
        run: |
          $ver = '${{ steps.v.outputs.ver }}'
          gh release create "v$ver" dist\PUBG_Izleyici.exe --title "PUBG İzleyici v$ver" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA --latest
